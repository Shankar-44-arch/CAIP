services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: caip_karnataka
      POSTGRES_USER: caip
      POSTGRES_PASSWORD: caip_secret
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caip"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: caip_karnataka
      POSTGRES_USER: caip
      POSTGRES_PASSWORD: caip_secret
      ENVIRONMENT: development
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      REDIS_ENABLED: "false"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
