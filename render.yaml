databases:
  - name: caip-postgres
    databaseName: caip_karnataka
    user: caip_user
    plan: free # Render's free tier postgres database (lasts 90 days)

services:
  - type: web
    name: caip-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caip-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: caip-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: caip-backend
          type: web
          property: host
